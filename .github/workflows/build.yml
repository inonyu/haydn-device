#
# Compile a haydn UEFI volume.
#
# Everything else in this repository is checked by tests that need nothing but
# Python. The questions those cannot answer -- does haydnPkg assemble, which DXE
# drivers are missing, does the FD link -- are answered here, and after runs 6
# and 7 the answer to all three is yes: edk2 builds the volume and the FD comes
# out at the full 0x200000.
#
# What it does, in the order that makes the first failure informative:
#
#   1. this repository's own checks, so a red run above them is not confused
#      with a red run below;
#   2. clone Mu-Silicium (with submodules) and put haydnPkg where its build
#      script looks for it;
#   3. seed Binaries/ from the venus set -- the same SoC, and the only set that
#      exists -- so the build gets past "binary not found" and reaches the
#      questions specific to haydn;
#   4. build, and keep whatever it says.
#
# Step 3 is a deliberate compromise, and its output must not be flashed: the
# Binaries carry venus's panel and PMIC tables. It exists to find the errors
# that have nothing to do with which phone the binaries came from.
#
name: UEFI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

jobs:
  # --------------------------------------------------------------------------
  # Everything that can be checked without edk2. Separate job so a failure here
  # is never mistaken for one in the build below.
  # --------------------------------------------------------------------------
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Unit tests
        run: |
          python3 tests/touch-format.py
          python3 tests/ufs-whitelist.py
          python3 tests/gpu-addresses.py
          python3 tests/loader-page.py
          python3 tests/adt-codec.py

      - name: Reserved memory is reproducible from both inputs
        run: |
          python3 scripts/gen-reserved.py docs/haydn-fdt.dts > /tmp/from-dts.dtsi
          python3 scripts/gen-reserved-live.py docs/haydn-fdt.dtb > /tmp/from-dtb.dtsi
          diff <(grep -o '[a-z_]*@0x[0-9a-f]*' /tmp/from-dts.dtsi) \
               <(grep -o '[a-z_]*@0x[0-9a-f]*' /tmp/from-dtb.dtsi)
          diff /tmp/from-dtb.dtsi dts/haydn-reserved.dtsi

      - name: Scripts
        run: |
          python3 scripts/check-reserved.py
          python3 scripts/verify-binaries.py
          python3 scripts/check-platform.py
          python3 scripts/check-workflows.py

      - name: Every TOML parses
        run: |
          python3 -c "import glob, tomllib; [tomllib.load(open(p, 'rb')) for p in glob.glob('**/*.toml', recursive=True)]; print('ok')"

      - name: No firmware in the tree
        run: |
          if find . -type f \( -name '*.mbn' -o -name '*.elf' -o -name '*.fv' -o -name '*.img' \) | grep -v '^\./\.git'; then
            echo 'firmware found in the tree'; exit 1
          fi
          echo 'none'

  # --------------------------------------------------------------------------
  # The build itself.
  #
  # This used to be marked "expected to fail", because everything it could do
  # was produce a log. Runs 6 and 7 changed that:
  # edk2 links the volume, 48 images verify, and SILICIUM_UEFI.fd comes out at
  # the full 0x200000. So the job is now honest -- a red run means the firmware
  # did not build, and a green one leaves the .fd and the .img as artifacts.
  # --------------------------------------------------------------------------
  uefi:
    name: UEFI
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: haydn

      # The whole 5 GB tree. --recursive pulls Binaries (Device-Binaries),
      # Common/Mu, Mu_Basecore, Silicium-ACPI and openssl.
      - name: Clone Mu-Silicium
        run: |
          git clone --recursive --depth 1 \
            https://github.com/Project-Silicium/Mu-Silicium.git
          cd Mu-Silicium
          git log -1 --format='%H %ci'

      - name: Install the build environment
        working-directory: Mu-Silicium
        run: |
          bash ./setup_env.sh -p apt

      # Mu-Silicium's build_uefi.py looks for */<device>Pkg and */*/<device>Pkg
      # under Platforms/ (get_device_package_path). Platforms/Xiaomi/haydnPkg
      # is the second shape, so that is where this goes.
      - name: Install haydnPkg
        run: |
          cp -r haydn/platform/haydnPkg Mu-Silicium/Platforms/Xiaomi/haydnPkg
          ls -la Mu-Silicium/Platforms/Xiaomi/haydnPkg

      # build_uefi.py also wants Resources/Configs/<device>.toml for the FD
      # numbers and the boot-image settings. venus.toml is the template; the
      # FD base and size below are this repo's, and check-platform.py already
      # proved them clear of every reserved region.
      - name: Install the device config
        run: |
          cat > Mu-Silicium/Resources/Configs/haydn.toml <<'EOF'
          # haydn (Redmi K40 Pro, SM8350, 8 GB). See haydn/docs/hardware.md.
          [boot_shim]
          requires_kernel_header = true

          [uefi_fd]
          base = 0x9FD00000
          size = 0x200000

          # append_dtb is off, and not because the DTB is hard to find.
          #
          # build_uefi.py appends Resources/DTBs/<device>.dtb to the kernel, so
          # the file has to be a *kernel* DTB -- the one this phone's own
          # vendor_boot and dtbo partitions hand to Android. What this
          # repository carries is docs/haydn-fdt.dtb: the FDT the bootloader
          # publishes at /sys/firmware/fdt, with the board's full
          # reserved-memory map and its own chosen/bootargs. Appending that
          # would give the kernel a second, vendor-shaped tree. The append goes
          # back on the day a real kernel DTB is recorded here.
          [boot_image_kernel]
          kernel_compression = "gzip"
          append_dtb         = false

          # header_version 3, not 1.
          #
          # The published image used to be v1 at 2048-byte pages, and the phone's
          # ABL rejected it: "Failed to load/authenticate boot image: Load Error",
          # before any of our code ran (docs/install.md). This board is Android 13
          # on SM8350 and launches through vendor_boot, which is the v3+ layout.
          #
          # mkbootimg.py derives the page size from the header version (v3/v4 ->
          # 4096), so this one number is the whole fix; there is no --pagesize.
          [boot_image]
          header_version = 3
          EOF
          cat Mu-Silicium/Resources/Configs/haydn.toml

      # The compromise. Device-Binaries has no haydn directory; venus is the
      # same SoC (SM8350, lahaina). This is enough to get past "file not found"
      # and reach the errors that are about haydn rather than about the binaries.
      - name: Seed Binaries from the venus set
        run: |
          cd Mu-Silicium
          if [ -d Binaries/haydn ]; then
            echo 'Binaries/haydn exists; using it'
          else
            echo 'Device-Binaries has no haydn; seeding from venus'
            cp -r Binaries/venus Binaries/haydn
            # The include files name the vendor directory explicitly.
            sed -i 's|Binaries/venus/|Binaries/haydn/|g' Platforms/Xiaomi/haydnPkg/Include/*.inc
            grep -c 'Binaries/haydn/' Platforms/Xiaomi/haydnPkg/Include/*.inc || true
          fi

      - name: Build
        id: build
        working-directory: Mu-Silicium
        run: |
          set -o pipefail
          python3 build_uefi.py -d haydn -r DEBUG 2>&1 | tee /tmp/build.log
          echo "exit=$?"

      # Whatever the build said is the point of this job, so it is kept even
      # when the build failed.
      - name: Keep the log
        if: always()
        run: |
          mkdir -p out
          cp /tmp/build.log out/ || true
          echo '=== the first error ===' >> out/summary.txt
          grep -m1 -iE 'error|not found|failed' /tmp/build.log >> out/summary.txt 2>&1 || echo '(no error line)' >> out/summary.txt
          echo >> out/summary.txt
          echo '=== every file the build said it could not find ===' >> out/summary.txt
          grep -oiE '[A-Za-z0-9_./-]+\.(inf|dec|fdf|dsc)' /tmp/build.log | sort -u >> out/summary.txt 2>&1 || true
          cat out/summary.txt

      # The volume and the boot image are the deliverable once the build is
      # green. Both are kept: the .fd is the firmware itself, and the .img is
      # what `fastboot boot` takes -- BootShim prepends itself, so the image
      # boots in RAM and leaves the flash alone.
      #
      # This must run BEFORE the upload below, or the artifact carries the log
      # and not the firmware.
      - name: If it built, keep the volume
        if: success()
        run: |
          mkdir -p out/fd
          find Mu-Silicium/Build/haydnPkg -name '*.fd' -exec cp {} out/fd/ \;
          ls -la out/fd
          cp Mu-Silicium/Mu-haydn.img out/ 2>/dev/null || \
            find Mu-Silicium -maxdepth 1 -name 'Mu-haydn*.img' -exec cp {} out/ \;
          ls -la out/

      # A green edk2 run says the package assembled and the FD linked. It does
      # not say the volume is this board's, and both ways that can go wrong are
      # silent: a wrong length, or a sibling board's tables inside it because
      # Binaries/ was seeded from venus. So check the bytes, not the exit code.
      - name: Check the volume is this board's
        if: success()
        run: |
          fd=$(find out -name 'SILICIUM_UEFI.fd' | head -1)
          img=$(find out -maxdepth 1 -name 'Mu-haydn*.img' | head -1)
          echo "fd=$fd img=$img"
          python3 haydn/scripts/verify-volume.py "$fd" "$img"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uefi-build-log
          path: out/
          compression-level: 9

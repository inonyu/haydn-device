# Resolve the build graph against a UniXNU checkout, and run the
# repository's own tests.
#
# This is not a boot test and it does not touch a phone. It answers two
# questions nothing on a Windows host can: does the configuration resolve
# against a UniXNU checkout, and do the pure-logic pieces still behave?
#
# What it deliberately does not do: download an IPSW, build a kernel, or
# produce a boot image. Those need Apple binaries that must not be in CI.

name: resolve

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  status:
    name: unixnu status --json
    # ubuntu, not macos: this job only parses the board configuration with
    # Python. It used to ask for macos-14, which this account cannot run
    # ("The configuration 'macos-14-arm64-us-default' is not supported"), and
    # the run was cancelled before it started. The kernel step is the one that
    # needs a Mac, and that is not here.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: UniXNU-haydn

      - name: Check out UniXNU beside it
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU
          submodules: recursive

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Select the board
        working-directory: UniXNU
        run: ./unixnu defconfig haydn_defconfig -D ../UniXNU-haydn

      - name: Resolve
        working-directory: UniXNU
        run: ./unixnu status --json

      - name: Show the tree
        working-directory: UniXNU
        run: ./unixnu tree

  tests:
    name: pure-logic tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The three pieces of pure logic in this repository: the FTS report
      # format (which an earlier draft of the touch driver got wrong), the UFS
      # whitelist (whose failure would be silent and dangerous), and the GPU's
      # addresses and speed table (checked against the tree they came from).
      # No compiler, no phone, no excuse.
      # The reserved-memory generator reads the FDT binary directly, so it does
      # not depend on dtc. Running both and diffing them proves the two inputs
      # describe the same board.
      - name: Reserved memory is reproducible from both inputs
        run: |
          python3 scripts/gen-reserved.py docs/haydn-fdt.dts > /tmp/from-dts.dtsi
          python3 scripts/gen-reserved-live.py docs/haydn-fdt.dtb > /tmp/from-dtb.dtsi
          diff <(grep -o '[a-z_]*@0x[0-9a-f]*' /tmp/from-dts.dtsi) \
               <(grep -o '[a-z_]*@0x[0-9a-f]*' /tmp/from-dtb.dtsi)
          diff /tmp/from-dtb.dtsi dts/haydn-reserved.dtsi

      - name: Tests
        run: |
          python3 tests/touch-format.py
          python3 tests/ufs-whitelist.py
          python3 tests/gpu-addresses.py
          python3 tests/loader-page.py
          python3 tests/adt-codec.py
          python3 scripts/check-reserved.py
          python3 scripts/verify-binaries.py
          python3 scripts/check-platform.py
          python3 scripts/check-workflows.py

      - name: The reserved-memory generator reproduces what is committed
        run: |
          if [ ! -f docs/haydn-fdt.dts ]; then
            echo 'docs/haydn-fdt.dts is not in the repository (it is 1.3 MB of'
            echo 'vendor tree). Regenerating from it is a developer step, not a'
            echo 'CI one: see README.'
            exit 0
          fi
          # The committed file is the DTB generator's output -- its own header
          # says so. Regenerating with the DTS generator and diffing proved
          # nothing except that the two generators print different headers, so
          # each is checked against the file it actually produces, and the two
          # are compared to each other on the region list.
          python3 scripts/gen-reserved.py docs/haydn-fdt.dts > /tmp/gen-dts.dtsi
          python3 scripts/gen-reserved-live.py docs/haydn-fdt.dtb > /tmp/gen-dtb.dtsi
          diff -u dts/haydn-reserved.dtsi /tmp/gen-dtb.dtsi

      - name: No firmware in the tree
        run: |
          if git ls-files | grep -E '\.(bin|fw|mdt|mbn|elf|tlv)$'; then
            echo 'firmware must not be committed: docs/firmware.md says how to take it'
            exit 1
          fi

      - name: Every TOML parses
        run: |
          python3 - <<'PY'
          import glob, sys, tomllib
          bad = []
          for path in glob.glob('**/*.toml', recursive=True):
              try:
                  tomllib.load(open(path, 'rb'))
              except Exception as exc:
                  bad.append(f'{path}: {exc}')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('all TOML parses')
          PY

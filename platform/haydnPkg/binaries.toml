# The firmware pieces a haydn UEFI build consumes.
#
# Not the UEFI volume: that is compiled from Mu-Silicium plus the Silicium
# SM8350 support, the way venusPkg's is. What comes from the phone is these.
#
# Extracted from the running handset on 2026-11-12 with root. docs/binaries.md
# says what each one is and why.
#
# The binaries themselves are NOT in this repository: they are Qualcomm's and
# the phone's. scripts/verify-binaries.py checks that the files put in
# Binaries/ are the ones this list describes.


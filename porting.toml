  "DSI0 ctrl 0xae94000 / PHY 0xae94400; DSI1 ctrl 0xae96000 / PHY 0xae96400.",
  "Panel qcom,mdss_dsi_k11_38_08_0a_dsc_cmd: 1080x2400, DSC, HDR10, 60/90/120 Hz.",
  "Backlight at /sys/class/backlight/panel0-backlight; no /dev/graphics/ exists.",
]
configuration = [

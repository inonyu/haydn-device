schema_version = 1

[device]
name = "haydn"
soc = "SM8350"
os_profile = "ipados-17.7.11-21H461"
summary = "Xiaomi Redmi K40 Pro (haydn, SM8350). Device tree and every hardware address taken from the phone's own live FDT (799754 bytes); arm64 profile because this SoC has no pointer authentication."

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = [
  "board.toml",
  "feeds.toml",
  "configs/**",
  "dts/**",
  "soc/**",
]
inputs = [
  "SoC SM8350 (lahaina), 4x Cortex-A55 + 3x Cortex-A78 + 1x Cortex-X1, 7,471,256 kB usable RAM.",
  "Board device tree read back from the running firmware: /sys/firmware/fdt, 799,754 bytes, pulled with root on 2026-11-12.",
  "userdata GPT: /dev/block/sda34 = 241,906,462,720 bytes = 59,059,195 x 4096-byte LBA.",
]
configuration = [
  "board.toml: soc = \"SM8350\", soc_source = \"sm8350\", os_profile = \"ipados-17.7.11-21H461\", kit = \"haydn\".",
  "config_fragments = arch + soc:configs/sm8350.config + os:configs/ipados.config; device patch series empty.",
  "dts/haydn.dts includes soc:dts/sm8350.dtsi and dts/haydn-reserved.dtsi; publishes a 6 GiB ADT window at 0x80000000 and the splash region at 0xdfc00000.",
]
limits = [
  "No haydn vendor UEFI volume set: Binaries/haydn is the venus SM8350 set.",
]
next_action = [
  "Extract the haydn XBL/UEFI volumes and rebuild haydnPkg from them.",
]
evidence = []

[[area]]
id = "firmware"
status = "planned"
components = []
paths = [
  "board.toml",
  "docs/uefi.md",
]
inputs = [
  "Mu-Silicium (Project-Silicium) main: LahainaPkg provides SM8350 SEC/PEI/DXE platform support.",
  "venusPkg (Mi 11, M2011K2C): same SoC, same vendor DXE inventory, used as the board template.",
]
configuration = [
  "[firmware] dsc = Platforms/Xiaomi/haydnPkg/haydn.dsc; config = haydn.",
  "[firmware.defines] DEVICE_MODEL = haydn, ENABLE_SECUREBOOT = 0.",
]
limits = [
  "haydnPkg does not exist; the venus package is the template.",
  "No firmware image has been built for this board.",
]
next_action = [
  "Generate haydnPkg from venusPkg and build SILICIUM_UEFI.fd.",
]
evidence = []

[[area]]
id = "cpu"
status = "planned"
components = []
paths = [
  "dts/**",
  "soc/dts/**",
  "configs/haydn_defconfig",
]
inputs = [
  "8 cores: A55 (0xd05) at MPIDR 0x000/0x100/0x200/0x300, A78 (0xd41) at 0x400/0x500/0x600, X1 (0xd44) at 0x700.",
  "GICv3 distributor 0x17a00000 (0x10000), redistributor 0x17a60000, stride 0x20000, 4 interrupt cells.",
  "Architected timer, timebase 19200000 Hz, PSCI 1.0 over SMC.",
  "Max clocks read on the phone: 1,804,800 / 2,419,200 / 2,841,600 kHz.",
]
configuration = [
  "soc:dts/sm8350.dtsi: cpus, psci, gic with unixnu,adt-name = intc.",
  "device:dts/haydn.dts marks cpu0-3 as the E cluster and cpu4-7 as the P cluster.",
  "haydn_defconfig: CONFIG_XNU_ARMCPU=y, CONFIG_XNU_ARM_DT_PLATFORM=y.",
]
limits = [
  "The CPU topology is recorded but no kernel has run on the device.",
  "Secondary core bring-up and IPI delivery are unverified.",
]
next_action = [
  "Build the kernel with CONFIG_XNU_ARMCPU and check the entry checkpoint.",
]
evidence = []

[[area]]
id = "memory"
status = "planned"
components = []
paths = [
  "dts/haydn-reserved.dtsi",
  "dts/haydn.dts",
]
inputs = [
  "DRAM: 0x80000000+0x37500000, 0x200000000+0x180000000, 0xc0000000+0x14000000 (12 GiB physical; 7.47 GiB usable).",
  "21 reserved regions, 607.7 MiB total, generated from the live FDT into dts/haydn-reserved.dtsi.",
  "Loader frame buffer reserved at 0xdfc00000 + 0x2300000 (splash_region).",
]
configuration = [
  "dts/haydn-reserved.dtsi is generated, never pasted, so every range stays auditable.",
  "[payload] dram_size = 0x180000000 (6 GiB), matching memory@80000000 in dts/haydn.dts.",
]
limits = [
  "The 6 GiB ADT window and 21 reserved regions are recorded, not yet exercised on hardware.",
  "Native SMMU is not enabled: no driver claims the SMMU streams.",
]
next_action = [
  "Confirm the reserved-memory carve-out survives the ADT encoder.",
]
evidence = []

[[area]]
id = "storage"
status = "host-verified"
components = []
paths = [
  "soc/dts/sm8350.dtsi",
  "configs/haydn_defconfig",
  "board.toml",
]
inputs = [
  "ufshc@1d84000: reg 0x1d84000+0x3000, 0x1d88000+0x8000, 0x1d90000+0x9000; SPI 0x109.",
  "ufsphy_mem@1d87000: reg 0x1d87000+0xe10; compatible qcom,ufs-phy-qmp-v4-lahaina; two lanes per direction.",
  "userdata = /dev/block/sda34, 59,059,195 x 4096-byte LBA.",
]
configuration = [
  "CONFIG_XNU_NATIVE_UFS=y with CONFIG_HAYDN_UFS_PROBE_ONLY=y for the first milestone.",
  "ShengUfs is selected as a component; its stream id needs this board's value.",
]
limits = [
  "\"No command list is put into the controller: that needs memory the loader offers, and this driver does not read the loader page yet.\"",
  "\"Nothing has been read from the flash by an XNU kernel on this board.\"",
  "The UFS PHY address in earlier records was wrong; it is corrected here to 0x1d87000.",
  "Probe-only: the audited IOBlockStorageDevice binding needs the real OS image.",
  "No UFS read has been performed by an XNU kernel on this board.",
]
next_action = [
  "\"Read the loader page and issue a TEST UNIT READY through it.\"",
  "\"Then READ CAPACITY(10) on LUN 0 and compare with the 59,059,195 blocks the phone reports.\"",
  "Build with CONFIG_XNU_NATIVE_UFS and confirm the probe reaches sda34.",
]
evidence = []


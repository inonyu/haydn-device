[[area]]
id = "input"
status = "host-verified"
components = []
paths = [
  "package/touch/**",
  "tests/touch-format.py",
  "soc/dts/sm8350.dtsi",
]
inputs = [
  "spi@a8c000, node focaltech@0, compatible focaltech,fts; SPI clock 6 MHz.",
  "Reset GPIO 22, IRQ GPIO 23 (falling edge); 10 touches; display coords 8640x19200.",
  "Live kernel binds spi1.0 to fts_ts; focaltech_touch.ko is loaded.",
]
configuration = [
  "No input driver is selected yet.",
  "QcomGeniSpi is selected so the SPI controller exists when a driver is written.",
]
limits = [
  "The FocalTech FTS controller is identified (SPI 0xa8c000, 6 MHz, GPIO 22/23) but no driver exists.",
  "Previous records noted a handshake only, with no HID events published.",
  "The SPI transfer is declared, not defined: XNU has no generic SPI client layer and QcomGeniSpi has to supply it.",
]
next_action = [
  "Adapt the FTS 5.x SPI protocol from HakiOS's goodix.c to this bus.",
]
evidence = []

[[area]]
id = "gpu"
status = "host-verified"
components = []
paths = [
  "soc/dts/sm8350.dtsi",
  "docs/hardware.md",
]
inputs = [
  "3D core 0x3d00000+0x40000, GMU 0x3d6a000+0x34000, GPUCC 0x3d90000, KGSL SMMU 0x3da0000+0x20000.",
  "qcom,chipid = 0x06060001 (Adreno 660), ubwc-mode 4, highest-bank-bit 0x10.",
  "SPI 0x12c (GPU), 0x130 (HFI), 0x131 (GMU). Eleven frequency levels, 855 to 900 MHz at the top.",
]
configuration = [
  "No GPU driver is selected: UniXNU's Adreno740 targets A740 + SM8550 only.",
  "The seven reg windows and the three SMMU contexts are described in soc:dts/sm8350.dtsi for the driver that comes later.",
]
limits = [
  "\"Only steps 1 to 3 are implemented, and all three read: nothing writes to the GPU block.\"",
  "\"The 3D core cannot leave secure mode until TrustZone loads the zap shader (step 19), and no TrustZone path exists here yet.\"",
  "\"Which of the two speed tables a handset uses is decided by its fuses, whose mapping is not documented; the driver takes the higher table rather than guessing.\"",
  "No Adreno driver is selected. UniXNU's Adreno740 targets A740 + SM8550 interfaces only.",
  "haydn is an Adreno 660: chipid 0x06060001, 855-900 MHz, none of which the A740 code covers.",
]
next_action = [
  "\"Write step 4 (the CX power switch) and stop there, then step 5 (its clocks).\"",
  "\"Steps 13 to 17 need the GMU firmware the phone carries, which is extracted and hash-pinned but not wired in.\"",
  "Adapt HakiOS's hakios.adreno.c: the gpucc/gmu/smmu block addresses are identical, the chip-keyed parts are not.",
]
evidence = []

